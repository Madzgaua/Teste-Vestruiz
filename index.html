<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidade Aumentada - Avestruz</title>
  <!-- Importa o componente WebAR do Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; background-color: #f5f5f5; }
  </style>
</head>
<body>

  <model-viewer 
    src="ostrich.glb" 
    ios-src="ostrich.usdz" 
    alt="Modelo 3D de animal da Mata Atlântica" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate>
  </model-viewer>

</body>
</html>
