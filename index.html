<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidade Aumentada - Mata Atlântica</title>
  
  <!-- Biblioteca do Google model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; background-color: #121212; font-family: Arial, sans-serif; }
    
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Estilização do Botão de AR */
    .btn-ar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #2e7d32; /* Verde ajustado para contraste com o texto branco */
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      padding: 16px 28px;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
      white-space: nowrap;
    }

    .btn-ar:active {
      background-color: #1b5e20;
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>
<body>

  <model-viewer 
    id="animal-viewer"
    src="ostrich.glb" 
    ios-src="ostrich.usdz" 
    alt="Animal em extinção da Mata Atlântica" 
    ar 
    ar-modes="scene-viewer quick-look webxr"
    camera-controls 
    auto-rotate>
    
    <!-- Botão customizado vinculado ao slot de AR -->
    <button slot="ar-button" class="btn-ar">
      📷 ATIVAR CÂMERA EM RA
    </button>

  </model-viewer>

  <!-- Script posicionado no final do body para garantir que o DOM já carregou -->
  <script>
    const modelViewer = document.querySelector('#animal-viewer');

    // Ao dar o primeiro toque em qualquer lugar da tela, ativa a Realidade Aumentada
    window.addEventListener('click', () => {
      if (modelViewer && modelViewer.canActivateAR) {
        modelViewer.activateAR();
      }
    }, { once: true });
  </script>

</body>
</html>
