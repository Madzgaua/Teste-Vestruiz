<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RA com MindAR - Mata Atlântica</title>
  
  <!-- Importa o A-Frame e a biblioteca do MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- Cena do MindAR configurada para rastrear a imagem compilada (targets.mind) -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- O targetIndex: 0 significa que é o primeiro alvo do seu arquivo targets.mind -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Insira o seu modelo 3D aqui (.gltf ou .glb) e ajuste a escala/posição -->
      <a-gltf-model 
        src="ostrich.glb" 
        position="0 0 0" 
        scale="2 2 2" 
        rotation="0 0 0">
      </a-gltf-model>

    </a-entity>
  </a-scene>

</body>
</html>
